
name: Oyku APK Olustur

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      - name: Android SDK paketlerini hazirla
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "SDK yoneticisi: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

    

      - name: APK derle
        run: gradle --no-daemon assembleDebug

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Oyku-Kelimeler-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
